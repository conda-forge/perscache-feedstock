schema_version: 1

context:
  version: 0.7.1

package:
  name: perscache
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/perscache/perscache-${{ version }}.tar.gz
  sha256: 76ddbb2d25ec475a98cc2a789b3b94006998330f2e4b7cad9281fb2e939868c0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pbr
    - setuptools
    - pip
  run:
    - python >=${{ python_min }}
    - beartype
    - cloudpickle
    - icontract

tests:
  - python:
      imports:
        - perscache
      python_version:
        - ${{ python_min }}.*
        - '*'
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - pip check

about:
  summary: "An easy to use decorator for persistent memoization: like `functools.lrucache`, but results can be saved in any format to any storage."
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/leshchenko1979/perscache

extra:
  recipe-maintainers:
    - pavelzw
